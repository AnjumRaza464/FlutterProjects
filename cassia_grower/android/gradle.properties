# Memory limits tuned for an 8 GB RAM machine (leaves room for the emulator + Windows).
# The Flutter template's default of -Xmx8G is larger than this machine's total RAM
# and crashes the Gradle daemon with "insufficient memory".
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. On Windows (especially on a non-system
# drive with antivirus active) the incremental cache files can get locked,
# causing "Could not close incremental caches" build failures.
kotlin.incremental=false
# Run the Kotlin compiler inside the Gradle process to avoid daemon file locks.
kotlin.compiler.execution.strategy=in-process
